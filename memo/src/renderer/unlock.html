<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memo unlock</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      button { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; padding: 0 5px 2px 0; border: 0; background: transparent; color: #f0f1ff; cursor: pointer; font-family: "Cascadia Mono", monospace; font-size: 15px; font-weight: 800; letter-spacing: -6px; text-shadow: 0 0 8px rgba(177, 168, 255, .9), 0 1px 6px rgba(0, 0, 0, .72); }
      button:hover { color: #fff; text-shadow: 0 0 11px rgba(177, 168, 255, 1), 0 1px 7px rgba(0, 0, 0, .8); }
      button span { animation: pulse 1.35s ease-in-out infinite; }
      button span:nth-child(1) { animation-delay: .32s; } button span:nth-child(2) { animation-delay: .16s; }
      @keyframes pulse { 0%, 100% { opacity: .3; } 48% { opacity: 1; } }
    </style>
  </head>
  <body><button id="unlock" aria-label="解除交互锁定"><span>‹</span><span>‹</span><span>‹</span></button>
    <script>document.getElementById('unlock').addEventListener('click', () => window.__TAURI__.core.invoke('unlock_click_through'));</script>
  </body>
</html>
