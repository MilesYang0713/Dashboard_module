<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Unlock Memo</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; }
      body { display: grid; place-items: center; font-family: system-ui, sans-serif; }
      button { width: 38px; height: 38px; border: 1px solid color-mix(in srgb, #8f82ff 72%, white); border-radius: 50%; background: color-mix(in srgb, #8f82ff 42%, transparent); color: white; box-shadow: 0 4px 15px #0005, inset 0 1px #fff7; backdrop-filter: blur(16px); cursor: pointer; font-size: 17px; }
      button:hover { background: #8f82ffcc; transform: scale(1.06); }
    </style>
  </head>
  <body><button id="unlock" title="解除交互锁定" aria-label="解除交互锁定">🔒</button>
    <script>
      document.querySelector('#unlock').addEventListener('click', () => window.__TAURI__.core.invoke('unlock_click_through'));
    </script>
  </body>
</html>
