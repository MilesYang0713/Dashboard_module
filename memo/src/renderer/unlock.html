<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Memo unlock control</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; }
      button { width: 100%; height: 100%; border: 0; outline: 0; background: transparent; cursor: pointer; }
    </style>
  </head>
  <body>
    <button id="unlock" aria-label="解除 Memo 交互锁定" title="解除交互锁定"></button>
    <script>
      document.getElementById('unlock').addEventListener('click', () => window.__TAURI__.core.invoke('unlock_click_through'));
    </script>
  </body>
</html>
